
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETB Pips - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #081522;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: #132638;
      padding: 30px;
      border-radius: 15px;
      width: 85%;
      max-width: 380px;
      text-align: center;
    }

    h1 { color: #20c997; }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #34516a;
      border-radius: 7px;
      background: #081522;
      color: white;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 7px;
      background: #20c997;
      color: #081522;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .switch {
      color: #20c997;
      cursor: pointer;
      background: none;
      border: none;
      width: auto;
      padding: 5px;
    }

    #message {
      font-size: 14px;
      margin-top: 15px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>ETB Pips</h1>

    <p id="heading">Welcome Back</p>

    <form id="authForm">

      <input
        id="email"
        type="email"
        placeholder="Email address"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password (minimum 6 characters)"
        minlength="6"
        required
      >

      <button id="submitButton" type="submit">
        Login
      </button>

    </form>

    <p id="message"></p>

    <p>
      <span id="switchText">Don't have an account?</span>
      <button type="button" class="switch" id="switchMode">
        Sign Up
      </button>
    </p>

    <a href="index.html" style="color:#20c997">
      Back to Home
    </a>

  </div>

  <script>
    const SUPABASE_URL =
      "https://bvpckueogvsmqpsivsgu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_u_L6_dLTgz6XMlJnMv5eJA_qrQ109OP";

    const message = document.getElementById("message");
    const form = document.getElementById("authForm");
    const submitButton = document.getElementById("submitButton");

    let isSignup = false;

    // Check Supabase connection
    if (!window.supabase) {
      message.textContent =
        "Connection error: Supabase library did not load.";
      throw new Error("Supabase library not loaded");
    }

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    // Switch between Login and Sign Up
    document.getElementById("switchMode").onclick = () => {

      isSignup = !isSignup;

      document.getElementById("heading").textContent =
        isSignup ? "Create Your Account" : "Welcome Back";

      submitButton.textContent =
        isSignup ? "Create Account" : "Login";

      document.getElementById("switchText").textContent =
        isSignup ? "Already have an account?" :
        "Don't have an account?";

      document.getElementById("switchMode").textContent =
        isSignup ? "Login" : "Sign Up";

      message.textContent = "";
    };

    // Handle Login and Registration
    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      message.textContent = "Please wait...";

      submitButton.disabled = true;

      try {

        let result;

        if (isSignup) {

          result = await supabaseClient.auth.signUp({
            email: email,
            password: password
          });

        } else {

          result = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        }

        if (result.error) {
          message.textContent = "Error: " + result.error.message;
          return;
        }

        if (isSignup) {

          message.textContent =
            "Account created! Check your email if confirmation is required.";

          form.reset();

        } else {

          message.textContent =
            "Login successful! Welcome to ETB Pips.";

          window.location.href = "index.html";

        }

      } catch (error) {

        message.textContent =
          "Connection error: " + error.message;

      } finally {

        submitButton.disabled = false;

      }

    });
  </script>

</body>
</html>
